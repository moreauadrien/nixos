#monitor = DP-1, 2560x1440@99.95Hz, 0x0, 1.25
monitor = eDP-1,2880x1800@120.00100,0x0,2

bindl = ,switch:on:Lid Switch,exec,hyprctl keyword monitor "eDP-1,disable"
